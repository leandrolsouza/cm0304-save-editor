name: CI Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Instalar Rust e dependências
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.98.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Compilar a interface e testar com IPC simulado
        run: npm run test:ui
      - name: Verificar formatação
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --offline --locked --workspace --all-targets -- -D warnings
      - name: Testar Rust sem amostras do jogo
        run: |
          cargo test --offline --locked --workspace --lib --bins -- --skip links_the_saved_tactic_to_the_human_managers_first_team --skip quick_actions_apply_to_the_managed_first_team_and_preserve_other_finances --skip restores_only_against_the_original_save_hash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --offline --locked -p cm0304-core --test dates
      - name: Testar a referência JavaScript sem amostras do jogo
        run: node --test --test-name-pattern='relative values|inverse round trips|keeper threshold|binary reader|embedded markers|rejects bad signature|detects equal-size'
