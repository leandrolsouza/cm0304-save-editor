name: Release Windows x64

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Instalar Rust e dependências do build
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.98.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Gerar instalador e assinatura do atualizador
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./tools/build-windows-release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-release
          path: target/release-assets/*
          if-no-files-found: error

  smoke:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-release
          path: release-assets
      - name: Conferir instalação e abertura em um Windows de CI
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "CM0304-Save-Editor-$version-windows-x64"
          $zip = "release-assets/$name.zip"
          $expected = (Get-Content -LiteralPath "$zip.sha256" -Raw).Split(' ')[0]
          if ((Get-FileHash -LiteralPath $zip).Hash -ne $expected) { throw 'SHA-256 do ZIP divergente.' }
          Expand-Archive -LiteralPath $zip -DestinationPath release-zip
          $installer = (Get-Item -LiteralPath "release-zip/CM0304 Save Editor_${version}_x64-setup.exe").FullName
          if ((Get-FileHash -LiteralPath $installer).Hash -ne (Get-FileHash -LiteralPath "release-assets/$name-setup.exe").Hash) { throw 'O instalador do ZIP difere do pacote do atualizador.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'cm0304-release-check'
          $result = Start-Process -FilePath $installer -ArgumentList "/S /D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Instalação retornou $($result.ExitCode)." }
          $editor = Get-Item -LiteralPath (Join-Path $installDir 'cm0304-desktop.exe')
          if ($editor.VersionInfo.ProductVersion -cne $version) { throw 'Versão instalada divergente.' }
          $process = Start-Process -FilePath $editor.FullName -WindowStyle Hidden -PassThru -Environment @{ PATH = "$env:SystemRoot\System32;$env:SystemRoot" }
          try {
            if ($process.WaitForExit(4000)) { throw "O editor encerrou na abertura com código $($process.ExitCode)." }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
          $result = Start-Process -FilePath (Join-Path $installDir 'uninstall.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path -LiteralPath $editor.FullName)) { throw 'Falha na desinstalação.' }

  draft:
    needs: smoke
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-release
          path: release-assets
      - name: Criar rascunho com os artefatos auditados
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = (Get-ChildItem -LiteralPath release-assets -File).FullName
          $notes = @"
          Baixe o ZIP para **Windows x64**, extraia o conteúdo e execute o instalador. O editor abre saves **.cm4 sem compactação** do **CM0304 4.1.5** e grava suas edições em uma cópia.

          Esta instalação verifica atualizações ao abrir e aplica versões assinadas quando não há carreira aberta. O instalador está sem assinatura Authenticode e pode gerar aviso do SmartScreen. O SHA-256 do ZIP está entre os arquivos da release.

          [Notas de versão e guia de uso](https://github.com/$env:GH_REPO/blob/$env:GITHUB_REF_NAME/README.md#notas-de-versão)
          "@
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --title "CM0304 Save Editor $env:GITHUB_REF_NAME" --notes $notes
