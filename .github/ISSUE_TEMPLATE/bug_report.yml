name: Report a bug
description: Tell us which version you used and how to reproduce the problem.
body:
  - type: input
    id: editor
    attributes:
      label: Editor version
      description: The version appears in the editor footer.
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: CM0304 version
      placeholder: '4.1.5'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe what happened and what you expected. Leave out personal information and game files.
    validations:
      required: true
